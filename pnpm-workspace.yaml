packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Base de données intégrée : prépare les fichiers de PostgreSQL à l'installation.
  '@embedded-postgres/windows-x64': true
  # Serveur AWS (Linux ARM) : il utilise le PostgreSQL du système, pas la base intégrée.
  '@embedded-postgres/linux-arm64': false
  '@prisma/engines': true
  esbuild: true
  prisma: true
