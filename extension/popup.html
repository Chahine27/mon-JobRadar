<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Job Radar</title>
    <style>
      body { margin: 0; width: 290px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
      .wrap { padding: 16px; display: grid; gap: 10px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
      .brand img { width: 30px; height: 30px; border-radius: 9px; }
      #status { padding: 10px 12px; border-radius: 10px; background: rgb(255 255 255 / 0.06); }
      #status.ok { background: rgb(74 222 128 / 0.15); color: #86efac; }
      #status.err { background: rgb(248 113 113 / 0.15); color: #fca5a5; }
      .small { font-size: 12px; color: #94a3b8; }
      a { color: #a5b4fc; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><img src="icons/icon48.png" alt="" /> Job Radar</div>
      <div id="status">Lecture de l'offre…</div>
      <div class="small">Raccourci : Alt + Maj + J · <a id="options">Réglages</a></div>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
