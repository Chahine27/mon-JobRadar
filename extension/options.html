<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Job Radar — réglages de l'extension</title>
    <style>
      body { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; border: 1px solid #cbd5e1; border-radius: 8px; }
      button { margin-top: 10px; padding: 8px 16px; font: inherit; font-weight: 600; border: none; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
      .muted { color: #64748b; font-size: 13px; }
      #msg { margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Job Radar — extension</h1>
    <label>Adresse de ton Job Radar
      <input id="base" placeholder="http://localhost:5173" />
    </label>
    <p class="muted">Par défaut : http://localhost:5173 (Job Radar lancé avec « pnpm dev » sur ce PC). À changer seulement si tu y accèdes par une autre adresse.</p>
    <button id="save">Enregistrer</button>
    <p id="msg"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
