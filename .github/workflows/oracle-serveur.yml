# Crée le serveur Oracle gratuit en réessayant toutes les 10 minutes (Paris est souvent plein).
# Serveur créé → une issue est ouverte (e-mail de GitHub) et ce workflow se désactive.
# Secrets : OCI_CONFIG (~/.oci/config-github) et OCI_KEY (~/.oci/oci_api_key.pem).
name: Serveur Oracle
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q oci
      - name: Clé d'API Oracle
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          # Copiés depuis Windows : fins de ligne \r retirées (sinon le chemin de la clé ne correspond à rien).
          printf '%s\n' "$OCI_CONFIG" | tr -d '\r' > ~/.oci/config
          # Clé refaite à partir de son seul contenu : le secret peut avoir ou non les lignes BEGIN / END,
          # et Oracle ajoute une ligne « OCI_API_KEY » après END, refusée par la bibliothèque.
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s\n' "$OCI_KEY" | tr -d '\r' | grep -v -e '-----' -e '^OCI_API_KEY$' -e '^[[:space:]]*$'
            echo "-----END PRIVATE KEY-----"
          } > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          # Contrôle sans rien afficher de secret : noms des réglages et début de la clé.
          sed -E 's/=.*/=…/' ~/.oci/config
          head -c 11 ~/.oci/oci_api_key.pem; echo
          echo "Secret OCI_KEY : $(printf '%s' "$OCI_KEY" | wc -l) lignes, $(printf '%s' "$OCI_KEY" | wc -c) caractères"
          echo "Clé gardée : $(wc -l < ~/.oci/oci_api_key.pem) lignes ; longueurs :"; awk '{print length($0)}' ~/.oci/oci_api_key.pem | sort -n | uniq -c
      # En cas d'erreur, sa dernière ligne devient une annotation (lisible sans ouvrir le journal).
      - run: python -u tools/oracle/create-instance.py --once 2> err.txt || { cat err.txt; echo "::error::$(tail -n 1 err.txt)"; exit 1; }
      - name: Prévenir et s'arrêter
        if: hashFiles('tools/oracle/instance.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Serveur Oracle prêt" --body "Le serveur jobradar est créé. Adresse IP publique : $(cat tools/oracle/instance.txt)"
          gh workflow disable "Serveur Oracle"
